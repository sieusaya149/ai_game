<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>HD gia cầm thú nuôi</title>
<style>
  body { margin: 0; padding: 10px; background: #8fbf6a; font: 12px sans-serif; color: #2a1a10; }
  h2 { margin: 12px 0 4px; font-size: 16px; }
  h3 { margin: 6px 0 2px; font-size: 12px; color: #3a2a10; }
  .row { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin: 2px 0 6px; }
  .pair { display: flex; gap: 2px; align-items: flex-end; background: #7fae5c; padding: 3px; border-radius: 3px; }
  .cell { display: flex; flex-direction: column; align-items: center; font-size: 10px; }
  canvas { image-rendering: pixelated; background: #9fcd78; }
  #chk { font: bold 13px monospace; padding: 6px; background: #fff8e0; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="chk"></div>
<div id="out"></div>
<script type="module">
import { SPR3 } from './art3.js';
import { SPR } from './art.js';
let SPR8 = {}, err = '';
try { ({ SPR8 } = await import('./art8.js')); } catch (e) { err = String(e && e.stack || e); }
const out = document.getElementById('out');
const only = new URLSearchParams(location.search).get('only');
const get = (o, path) => path.split('.').reduce((a, k) => a?.[k], o);
const oldOf = path => get(SPR3, path) ?? (path.startsWith('eggGround') ? get(SPR, path) : undefined);
const isImg = v => v instanceof HTMLCanvasElement;
const S = Number(new URLSearchParams(location.search).get('s')) || 4;
const pick = new URLSearchParams(location.search).get('p');   // chỉ vẽ các mục có đường dẫn chứa chuỗi này
function cv(im, scale, label) {
  const d = document.createElement('div'); d.className = 'cell';
  const c = document.createElement('canvas');
  if (im) { c.width = im.width; c.height = im.height; c.getContext('2d').drawImage(im, 0, 0); c.style.width = im.width * scale + 'px'; c.style.height = im.height * scale + 'px'; }
  else { c.width = 1; c.height = 1; c.style.width = '40px'; c.style.height = '40px'; c.style.background = '#c44'; }
  d.append(label, c); return d;
}
function pairCell(o, n, tag) {
  const p = document.createElement('div'); p.className = 'pair';
  p.append(cv(o, S, `Cũ ${tag}`), cv(n, S / 2, 'Mới'));
  return p;
}
// một mục: thu các ảnh (bỏ bản right vì chỉ là lật), mỗi ảnh một cặp Cũ / Mới
function leaves(v, path, acc) {
  if (isImg(v)) acc.push(path);
  else if (Array.isArray(v)) v.forEach((x, i) => leaves(x, path + '.' + i, acc));
  else if (v && typeof v === 'object') for (const k of Object.keys(v)) if (k !== 'right') leaves(v[k], path + '.' + k, acc);
  return acc;
}
function entry(path, title) {
  const v = get(SPR8, path);
  const h = document.createElement('h3'); h.textContent = title + '  [' + path + ']'; out.append(h);
  if (!v) { const p = document.createElement('div'); p.textContent = '(chưa vẽ)'; out.append(p); return; }
  const list = leaves(v, path, []);
  // gom theo giai đoạn: mỗi nhóm con trực tiếp một hàng
  const groups = new Map();
  for (const p of list) { const g = p.slice(path.length + 1).split('.')[0] || '-'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(p); }
  for (const [g, ps] of groups) {
    const row = document.createElement('div'); row.className = 'row';
    for (const p of ps) row.append(pairCell(oldOf(p), get(SPR8, p), p.slice(path.length + 1)));
    out.append(row);
  }
}
const SECTIONS = {
  ga: ['Gà', [['animal.ga', 'Gà mái đi'], ['run.ga', 'Gà mái chạy hoảng'], ['sleepBy.ga', 'Gà mái ngủ'], ['sickBy.ga', 'Gà mái bệnh'],
    ['animal.gaTrong', 'Gà trống đi'], ['run.gaTrong', 'Gà trống chạy hoảng'], ['sleepBy.gaTrong', 'Gà trống ngủ'], ['sickBy.gaTrong', 'Gà trống bệnh'],
    ['eggGround', 'Trứng gà (SPR.eggGround)'], ['eggNest', 'Ổ trứng gà'], ['eggFertile', 'Trứng gà soi có phôi']]],
  vit: ['Vịt', [['animal.vit', 'Vịt mái đi'], ['run.vit', 'Vịt chạy hoảng'], ['sleepBy.vit', 'Vịt mái ngủ'], ['sickBy.vit', 'Vịt mái bệnh'],
    ['animal.vitDuc', 'Vịt cồ đi'], ['sleepBy.vitDuc', 'Vịt cồ ngủ'], ['sickBy.vitDuc', 'Vịt cồ bệnh'],
    ['eggDuck', 'Trứng vịt'], ['eggNestDuck', 'Ổ trứng vịt'], ['eggDuckFertile', 'Trứng vịt soi có phôi']]],
  cho: ['Chó Mực', [['animal.cho', 'Đi'], ['sleepBy.cho', 'Ngủ'], ['sickBy.cho', 'Bệnh'], ['dogSitBy', 'Ngồi'], ['dogBegBy', 'Bắt tay'],
    ['dogHerdBy', 'Lùa đàn'], ['dogBarkBy', 'Sủa'], ['dogRunBy', 'Chạy đuổi khách']]],
  meo: ['Mèo mướp', [['animal.meo', 'Đi'], ['sleepBy.meo', 'Ngủ'], ['sickBy.meo', 'Bệnh'], ['catPounceBy', 'Vồ'], ['catNapBy', 'Phơi nắng'],
    ['catMouseBy', 'Ngậm chuột'], ['catYarn', 'Cuộn len'], ['ratTrophy', 'Chuột chiến lợi phẩm'], ['spatBubble', 'Bong bóng cãi nhau']]],
};
for (const [id, [title, items]] of Object.entries(SECTIONS)) {
  if (only && !only.split(',').includes(id)) continue;
  const h = document.createElement('h2'); h.textContent = title; out.append(h);
  for (const [p, t] of items) if (!pick || pick.split(',').some(q => p.includes(q))) entry(p, t);
}
// kiểm cỡ: mọi ảnh trong SPR8 (kể cả bản right và alias) phải đúng 2× ảnh cũ cùng đường dẫn
function all(v, path, acc) {
  if (isImg(v)) acc.push(path);
  else if (Array.isArray(v)) v.forEach((x, i) => all(x, path + '.' + i, acc));
  else if (v && typeof v === 'object') for (const k of Object.keys(v)) all(v[k], path ? path + '.' + k : k, acc);
  return acc;
}
const paths = all(SPR8, '', []), bad = [];
for (const p of paths) {
  const o = oldOf(p), n = get(SPR8, p);
  if (!isImg(o)) bad.push(p + ': không có khóa cũ');
  else if (n.width !== o.width * 2 || n.height !== o.height * 2) bad.push(`${p}: ${n.width}x${n.height} ≠ 2×${o.width}x${o.height}`);
}
const msg = `Kiểm cỡ: ${paths.length} ảnh, ${bad.length} lỗi` + (bad.length ? '\n' + bad.join('\n') : '') + (err ? '\nLỖI NẠP: ' + err : '');
document.getElementById('chk').textContent = msg;
console.log('CHECK ' + msg);
window.__ready = true;
</script>
</body>
</html>
