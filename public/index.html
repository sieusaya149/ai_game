<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5d3a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nông Trại Vui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="fade"></div>

  <div id="ui">
    <!-- HUD trên -->
    <div id="hud">
      <div class="hud-row">
        <div id="hud-player" class="card">
          <canvas id="hud-avatar" width="44" height="44"></canvas>
          <span id="hud-net" role="status" title="Mất kết nối với làng, vẫn chơi tiếp được. Có mạng lại sẽ tự lưu lên làng." hidden>📡</span>
          <div class="hud-who">
            <div class="hud-name"><b id="hud-name">-</b><span id="hud-level" class="lv">Cấp 1</span></div>
            <div class="expbar"><i id="hud-exp"></i><span id="hud-exp-text"></span></div>
            <div class="stam" id="hud-stamina" title="Thể lực"><canvas id="hud-stam-ico" width="12" height="12"></canvas><div class="stambar"><i id="hud-stam"></i><span id="hud-stam-text"></span></div></div>
          </div>
        </div>
        <div id="hud-coins" class="pill coins">🪙 <b id="hud-coins-n">0</b></div>
      </div>
      <div class="hud-row small">
        <div class="pill" id="hud-clock"><canvas id="hud-season-ico" width="12" height="12"></canvas><b id="hud-season">Xuân</b><span id="hud-weather">☀️</span> <span id="hud-time">Ngày 1</span></div>
        <div class="pill" id="hud-water">💧 <b id="hud-can">0/10</b></div>
        <div class="pill" id="hud-basket" title="Giỏ: số món / sức chứa">🧺 <b id="hud-basket-n">0/30</b></div>
      </div>
      <div id="tutorial" hidden></div>
      <!-- Đang thăm vườn người khác (issue 27): tên chủ vườn + nút đi ra cổng về làng + số lượt giúp còn lại hôm nay (issue 28) -->
      <div id="visit-bar" class="card" hidden><div class="visit-row"><span class="visit-where" title="Đang thăm vườn người khác">🏡 Vườn <b id="visit-owner"></b></span><button class="btn green sm" id="visit-leave" type="button">🚪 Về làng</button></div><span id="visit-help" title="Số việc giúp vườn này còn nhận hôm nay"></span></div>
      <div id="coutquest" hidden></div>
      <div id="seasonquest" hidden></div>
    </div>

    <!-- Hành động: góc dưới phải -->
    <div id="actions">
      <div id="target-name" hidden></div>
      <div id="chips"></div>
      <button id="main-action" class="btn" hidden>
        <span class="ma-icon"></span><span class="ma-label"></span>
      </button>
    </div>

    <!-- Làng real-time (vườn online): biểu cảm, chat nhanh, người đang ở cùng bản đồ -->
    <div id="live" hidden>
      <div id="live-says" class="card" hidden></div>
      <div class="live-row" id="live-emotes"></div>
      <div class="live-row">
        <button class="live-btn" id="live-chat" type="button" title="Chat nhanh" aria-label="Chat nhanh">💬</button>
        <button class="live-btn" id="live-friends" type="button" title="Bạn bè" aria-label="Bạn bè">👫</button>
        <button class="live-btn wide" id="live-people" type="button" title="Người đang ở đây" aria-label="Người đang ở đây">👥 <b id="live-n">1</b></button>
      </div>
    </div>

    <!-- Thanh dưới -->
    <nav id="bottombar">
      <button class="bb-btn" id="bb-seed"><span class="bb-ico"></span><span class="bb-badge" id="bb-seed-n">0</span><span class="bb-lbl">Hạt</span></button>
      <button class="bb-btn" data-panel="bag"><span class="bb-ico">🎒</span><span class="bb-lbl">Túi đồ</span></button>
      <button class="bb-btn" id="bb-build" title="Chế độ xây dựng: dời công trình"><span class="bb-ico">🔨</span><span class="bb-lbl">Xây dựng</span></button>
      <button class="bb-btn" data-panel="board"><span class="bb-ico">📋</span><i class="dot" id="dot-board" hidden></i><span class="bb-lbl">Đơn hàng</span></button>
      <button class="bb-btn" data-panel="achievements"><span class="bb-ico">🏆</span><span class="bb-lbl">Thành tựu</span></button>
      <button class="bb-btn" data-panel="log"><span class="bb-ico">📜</span><span class="bb-lbl">Nhật ký</span></button>
      <button class="bb-btn" data-panel="settings"><span class="bb-ico">⚙️</span><span class="bb-lbl">Cài đặt</span></button>
    </nav>

    <!-- Chế độ xây dựng -->
    <div id="buildbar" hidden>
      <div id="build-msg" class="card">Chạm và kéo công trình để dời chỗ</div>
      <div id="build-water" class="card" hidden></div>
      <button class="btn red sm" id="build-store" type="button" hidden>Cất</button>
<button class="btn green sm" id="build-upgrade" type="button" hidden>Nâng cấp</button>
      <div id="build-tray" class="card"></div>
      <div class="build-btns">
        <button class="btn red big" id="build-cancel" type="button">✖ Hủy</button>
        <button class="btn green big" id="build-done" type="button">✔ Xong</button>
      </div>
    </div>

    <!-- Bản đồ nhỏ (chạm để phóng to) + nút mở bảng Việc cần làm -->
    <div id="mini-wrap" hidden>
      <button id="minimap" type="button" title="Bản đồ nhỏ, chạm để phóng to"><canvas id="mini-cv" width="96" height="96"></canvas></button>
      <button id="todo-btn" type="button" title="Việc cần làm"><canvas id="todo-ico" width="12" height="12"></canvas><b id="todo-n" hidden>0</b></button>
      <button class="pill btn-pill" id="hud-speed" type="button" title="Tốc độ game">⏩ x1</button>
    </div>
    <div id="alert-arrows"></div>
    <div id="alert-bar">
      <button id="alert-banner" type="button" role="alert" hidden></button>
      <button id="alert-home" type="button" hidden>🏡 Về vườn</button>
    </div>
    <div id="toasts"></div>
    <div id="badges"></div>
    <div id="panel-root" hidden></div>
    <div id="celebrate" hidden></div>
    <div id="dialog-root" hidden></div>
    <div id="away" hidden></div>
    <div id="whatsnew" hidden></div>
    <div id="creator" hidden></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
