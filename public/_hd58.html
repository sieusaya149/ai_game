<!doctype html><meta charset="utf-8"><title>Tự động hóa khối ruộng</title>
<style>
  body { margin: 0; padding: 10px; background: #4f8a34; font: 12px sans-serif; color: #fff; }
  h2 { margin: 6px 0; font-size: 14px; }
  canvas { image-rendering: pixelated; display: block; }
  .row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; flex-wrap: wrap; }
  .cell { background: #5e9a40; border: 1px solid #2f5a1e; padding: 4px; text-align: center; }
  .pair { display: flex; gap: 4px; align-items: flex-end; }
  #report { white-space: pre; font: 12px monospace; background: #222; padding: 6px; }
</style>
<body>
<h2>Tự động hóa khối ruộng (issue 58): mỗi ô = bộ thường | bộ 2x (phóng ×4 cùng cỡ màn hình), nền là đất đã cuốc</h2>
<div id="rows"></div>
<div id="report"></div>
<script type="module">
import { AUTO_ART as A, AUTO_ART_HD as B } from './art58.js';
import { SPR } from './art.js';
import { hdOf } from './hd.js';
const S = +(new URLSearchParams(location.search).get('s') || 4), rows = document.getElementById('rows'), rep = [];
// ô 16x16 trong suốt (lớp phủ) thì vẽ chồng lên đất đã cuốc cho dễ xem
function view(im, k, soil) {
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  c.style.width = (im.width / k) * S + 'px'; c.style.height = (im.height / k) * S + 'px';
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  if (soil) { const b = k === 2 ? (hdOf(soil) ?? soil) : soil; x.drawImage(b, 0, 0, c.width, c.height); }
  x.drawImage(im, 0, 0);
  return c;
}
let row;
const newRow = () => { row = document.createElement('div'); row.className = 'row'; rows.append(row); };
function cell(title, a, b, soil) {
  const d = document.createElement('div'); d.className = 'cell';
  const p = document.createElement('div'); p.className = 'pair'; p.append(view(a, 1, soil), view(b, 2, soil));
  d.append(p, title); row.append(d);
  const ok = b.width === a.width * 2 && b.height === a.height * 2;
  rep.push(`${title}: ${a.width}x${a.height} → ${b.width}x${b.height} ${ok ? 'OK' : 'SAI'}`);
}
const wet = SPR.soil.tilledWet, dry = SPR.soil.tilledDry;
newRow();
cell('Đất màu mỡ (ô khô)', A.rich, B.rich, dry); cell('Đất màu mỡ (ô ướt)', A.rich, B.rich, wet);
newRow();
cell('Nhỏ giọt: chờ', A.drip.idle, B.drip.idle, wet);
cell('Nhỏ giọt: đang tưới 1', A.drip.on[0], B.drip.on[0], dry); cell('Nhỏ giọt: đang tưới 2', A.drip.on[1], B.drip.on[1], dry);
cell('Nhỏ giọt: ngừng', A.drip.off, B.drip.off, dry);
newRow();
cell('Máy phun: chờ', A.sprayer.idle, B.sprayer.idle);
cell('Máy phun: đang phun 1', A.sprayer.on[0], B.sprayer.on[0]); cell('Máy phun: đang phun 2', A.sprayer.on[1], B.sprayer.on[1]);
cell('Máy phun: ngừng', A.sprayer.off, B.sprayer.off);
newRow();
for (const k of ['drip', 'spray', 'rich']) cell(`Biểu tượng ${k}`, A.badge[k], B.badge[k]);
document.getElementById('report').textContent = rep.join('\n');
document.body.dataset.done = '1';
</script>
