<!doctype html><meta charset="utf-8"><title>HD9</title>
<style>
  body { margin: 0; padding: 8px; background: #5a9e3a; font: 11px sans-serif; color: #fff; }
  h2 { margin: 10px 0 2px; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .pair { display: flex; gap: 3px; align-items: flex-end; background: rgba(0,0,0,0.12); padding: 3px; }
  .cell { display: flex; flex-direction: column; gap: 1px; }
  .cell span { font-size: 9px; color: #ffe9a8; }
  canvas { image-rendering: pixelated; }
  #bad { color: #ffb0a0; font-weight: bold; }
</style>
<body>
<div id="bad"></div>
<div id="root"></div>
<script type="module">
import { SPR3, muddy } from './art3.js';
import { SPR } from './art.js';
import { SPR9, SPR9_FROM, muddyHD } from './art9.js';
const q = new URLSearchParams(location.search);
const Z = Number(q.get('z') || 4), only = q.get('only'), side = q.get('side') || 'left', pf = q.get('p');
const root = document.getElementById('root');
const OLD = { SPR3, SPR };
const bad = [], ok = [];
function cv(img, z) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  c.style.width = img.width * z + 'px'; c.style.height = img.height * z + 'px';
  return c;
}
function cell(img, label, z) {
  const d = document.createElement('div'); d.className = 'cell';
  const s = document.createElement('span'); s.textContent = label; d.append(s, cv(img, z)); return d;
}
// Duyệt song song bộ mới và bộ cũ, kiểm cỡ 2x ở MỌI lá (kể cả 'right'), chỉ vẽ phía `side`.
function walk(row, nv, ov, path, show) {
  if (nv instanceof HTMLCanvasElement) {
    if (!(ov instanceof HTMLCanvasElement)) { bad.push(`${path}: không có khóa cũ`); return; }
    if (nv.width !== ov.width * 2 || nv.height !== ov.height * 2) bad.push(`${path}: ${nv.width}x${nv.height} ≠ 2×${ov.width}x${ov.height}`);
    else ok.push(path);
    if (show && (!pf || pf.split(',').some(s => path.includes(s)))) { const p = document.createElement('div'); p.className = 'pair'; p.append(cell(ov, `Cũ ${path.split('.').slice(-2).join('.')} ${ov.width}x${ov.height}`, Z), cell(nv, `Mới ${nv.width}x${nv.height}`, Z / 2)); row.append(p); }
    return;
  }
  if (ov == null) { bad.push(`${path}: không có khóa cũ`); return; }
  for (const k in nv) {
    const sh = show && !(k === 'left' || k === 'right') || show && k === side;
    walk(row, nv[k], ov[k], `${path}.${k}`, sh);
  }
}
for (const top in SPR9) {
  const src = OLD[SPR9_FROM[top] ?? 'SPR3'];
  if (only && !only.split(',').some(o => top === o || top.startsWith(o))) { walk(document.createElement('div'), SPR9[top], src[top], top, false); continue; }
  const h = document.createElement('h2'); h.textContent = `${top}  (thay ${SPR9_FROM[top] ?? 'SPR3'}.${top})`;
  const row = document.createElement('div'); row.className = 'row';
  root.append(h, row);
  walk(row, SPR9[top], src[top], top, true);
}
if (!only || only.includes('muddy')) {
  const h = document.createElement('h2'); h.textContent = 'muddy() cũ / muddyHD() mới (bùn bám theo dáng)';
  const row = document.createElement('div'); row.className = 'row'; root.append(h, row);
  for (const sp of ['heo', 'bo', 'cuu']) for (const lv of [1, 3]) {
    const p = document.createElement('div'); p.className = 'pair';
    p.append(cell(muddy(SPR3.animal[sp].truong.left[0], lv), `Cũ ${sp} bùn${lv}`, Z), cell(muddyHD(SPR9.animal[sp].truong.left[0], lv), 'Mới', Z / 2));
    row.append(p);
  }
}
document.getElementById('bad').textContent = bad.length ? 'SAI CỠ: ' + bad.join(' | ') : `Kiểm cỡ: ${ok.length} sprite đều đúng 2×`;
window.__sizeReport = { ok: ok.length, bad };
window.__ready = true;
</script>
