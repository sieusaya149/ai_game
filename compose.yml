# Chạy trên VPS sau Caddy của ai_gateway: container nằm trong network `gateway`,
# gateway chuyển game.huninna.com tới ai-game:80.
#
#   docker compose up -d --build
name: ai-game

services:
  web:
    build: .
    image: ai-game:latest
    container_name: ai-game
    restart: unless-stopped
    networks:
      - gateway

networks:
  gateway:
    external: true
    name: gateway
